# Hooks de pré-commit du navigateur SIA.
#
# Le code produit, les interfaces et les scripts suivis sont désormais soumis
# aux mêmes garde-fous. Le typage reste progressif : seuls les modules inscrits
# dans le hook mypy sont bloquants jusqu'à réduction de la dette historique.
#
# Installation :
#     pip install pre-commit && pre-commit install
# Passage manuel sur tout le dépôt :
#     pre-commit run --all-files

repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=90"]
        files: ^(core|engine|schemas|swiss_sia|ui|scripts|tests|ve_adapter|examples)/.*\.py$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--config=.flake8"]
        files: ^(core|engine|schemas|swiss_sia|ui|scripts|tests|ve_adapter|examples)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ["--strict", "--show-error-codes"]
        files: ^(core|schemas)/.*\.py$
        additional_dependencies:
          - pydantic>=2.5.0

      - id: mypy
        name: mypy (progressive swiss_sia boundary)
        args: ["--strict", "--show-error-codes", "--exclude=^$"]
        files: ^swiss_sia/(assessment_governance|client_report_context|project_evidence_translations|value_integrity)\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: ^(core|engine|schemas|swiss_sia|ui|scripts|tests|ve_adapter|examples)/
      - id: end-of-file-fixer
        files: ^(core|engine|schemas|swiss_sia|ui|scripts|tests|ve_adapter|examples)/
      - id: check-yaml
      - id: check-toml
      # Les classeurs SIA officiels pèsent jusqu'à 30 Mo et n'ont rien à faire
      # dans l'historique git : ils sont non redistribuables et font foi.
      - id: check-added-large-files
        args: ["--maxkb=2048"]
