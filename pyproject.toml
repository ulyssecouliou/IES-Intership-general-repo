[tool.poetry]
name = "swiss-sia-navigator"
version = "0.1.0"
description = "Validation de la conformité IESVE aux classes SIA 4010 (1A à 5)"
authors = ["IES — Integrated Environmental Solutions"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "schemas" },
    { include = "swiss_sia" },
]

# La borne basse vient du Python embarqué de VE 2025, mesuré le 2026-08-06 :
# 3.12.3. On déclare ^3.10 comme demandé, mais tout code destiné à tourner
# DANS VE doit rester compatible 3.12 — c'est la seule version qui compte à
# l'exécution.
[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.5.0"
pandas = "^2.0.0"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^2.3.0"
black = "^26.5.1"
flake8 = "^7.3.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 90
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
# `swiss_sia` est un existant volumineux (config.py fait ~1780 lignes) qui n'a
# jamais été typé. Le soumettre à --strict d'un coup produirait des centaines
# d'erreurs et rendrait mypy inutilisable. Les nouveaux paquets, eux, sont
# stricts dès le premier jour.
exclude = ["^swiss_sia/", "^tests/", "^examples/", "^scripts/", "^tmp/"]

[[tool.mypy.overrides]]
module = ["iesve", "iesve.*"]
ignore_missing_imports = true

# `exclude` ne suffit pas : mypy SUIT les imports, et `checker_factory` importe
# les checkers de `swiss_sia`. Sans ce `follow_imports = "skip"`, un contrôle de
# `core/` remonte 41 erreurs de l'existant non typé et devient inexploitable.
# Vérifié le 2026-08-06 : avec cette règle, `mypy --strict core schemas` sort
# à zéro erreur, et les erreurs de `swiss_sia` restent visibles quand on cible
# explicitement ce paquet.
[[tool.mypy.overrides]]
module = ["swiss_sia.*"]
follow_imports = "skip"
ignore_errors = true

# Premier lot `swiss_sia` rendu strict. Cette liste ne doit grandir qu'apres
# passage a zero erreur, afin que le typage reste un garde-fou exploitable.
[[tool.mypy.overrides]]
module = [
    "swiss_sia.client_report_context",
    "swiss_sia.assessment_governance",
    "swiss_sia.project_evidence_translations",
    "swiss_sia.value_integrity",
]
follow_imports = "normal"
ignore_errors = false

[tool.pytest.ini_options]
# Les suites du navigateur SIA 4010 vivent a cote de leur code, pas sous
# tests/. Sans elles ici, 283 tests ne sont jamais collectes -- et une suite
# verte qui ignore un tiers du depot est pire qu une suite rouge.
testpaths = ["tests", "engine/tests", "ve_adapter/tests", "ui/tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = [
    ".git",
    ".codex_test_runs",
    ".test-tmp*",
    ".tmp*",
    "tmp*",
    "tests/_pytest_full_release_20260824",
]
# Nos tests sont des FONCTIONS. Sans cette restriction, pytest tente de
# collecter les schémas `TestResult` et `TestStatus` — dont le nom commence par
# « Test » — et émet un PytestCollectionWarning à chaque exécution. Une suite
# verte qui crache des avertissements finit par ne plus être lue.
python_classes = ["*TestCase"]

[tool.flake8]
# flake8 ne lit pas pyproject.toml nativement ; ces valeurs sont reprises dans
# .flake8 pour être effectives. Conservées ici comme référence unique.
max-line-length = 90
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", "tmp", "outputs", "reports"]
