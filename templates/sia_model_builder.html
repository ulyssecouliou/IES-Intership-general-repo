<!doctype html>
<!-- lang is updated at runtime by applyLanguage(); "en" is the default. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss VE Model Builder — IESVE</title>
  <style>
    /* ============================================================
       Design tokens
       A single disciplined scale keeps every surface, spacing and
       type step consistent across the interface.
       ============================================================ */
    :root {
      color-scheme: light dark;

      /* Brand: deep evergreen primary with a bright technical accent. */
      --brand-900: #0b2f27;
      --brand-800: #0e3b31;
      --brand-700: #10513f;
      --brand-600: #12715a;
      --brand-500: #178a6d;
      --brand-400: #35a583;
      --brand-300: #6ec4a6;
      --brand-100: #d9efe5;
      --brand-050: #eef8f3;

      /* Neutrals */
      --ink: #0f1e1a;
      --ink-soft: #33443e;
      --muted: #5f7168;
      /* Small 10px uppercase labels use --subtle, so it must clear WCAG AA
         (>=4.5:1) on both the panel and the tinted feature-card surfaces. */
      --subtle: #5d6f67;
      --line: #dde5e0;
      --line-strong: #c6d3cc;
      --paper: #f2f5f3;
      --panel: #ffffff;
      --panel-alt: #f8faf9;

      /* Semantic */
      --ok: #15734f;
      --ok-bg: #e6f4ec;
      --warn: #8a5a00;
      --warn-bg: #fdf3da;
      --danger: #a72b28;
      --danger-bg: #fdeeec;

      /* Elevation */
      --shadow-sm: 0 1px 2px rgba(11, 47, 39, .06);
      --shadow-md: 0 4px 14px rgba(11, 47, 39, .07), 0 1px 3px rgba(11, 47, 39, .05);
      --shadow-lg: 0 18px 48px rgba(11, 47, 39, .10), 0 2px 8px rgba(11, 47, 39, .05);

      /* Geometry */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 20px;

      --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8f0ec;
        --ink-soft: #c4d3cc;
        --muted: #93a49c;
        --subtle: #6f817a;
        --line: #23342d;
        --line-strong: #2f443b;
        --paper: #0b1512;
        --panel: #101d18;
        --panel-alt: #14241e;
        --brand-100: #16352a;
        --brand-050: #12291f;
        --ok: #6ecfa2;
        --ok-bg: #12301f;
        --warn: #e0b256;
        --warn-bg: #2f2412;
        --danger: #e58b86;
        --danger-bg: #33191a;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
        --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
        --shadow-lg: 0 18px 48px rgba(0, 0, 0, .55);
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
      background-image:
        radial-gradient(1100px 420px at 12% -8%, rgba(53, 165, 131, .13), transparent 70%),
        radial-gradient(900px 380px at 100% 0%, rgba(18, 113, 90, .08), transparent 65%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--brand-500);
      outline-offset: 2px;
    }

    /* ============================================================ Layout */
    .shell {
      width: min(1320px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    /* ============================================================ Topbar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      margin-bottom: 26px;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(145deg, var(--brand-600), var(--brand-800));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .02em;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-text b { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .brand-text span { color: var(--muted); font-size: 11.5px; }
    .topbar-spacer { flex: 1; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .chip .dot {
      width: 7px; height: 7px; flex: none;
      border-radius: 50%;
      background: var(--brand-500);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 22%, transparent);
    }
    /* Language picker: Swiss compliance runs in DE/FR/IT, plus EN. */
    .lang {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .lang select {
      height: 34px;
      min-width: 118px;
      padding: 0 30px 0 10px;
      border-radius: var(--r-sm);
      font-size: 12.5px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px;
    }

    /* ============================================================ Hero */
    .hero { margin-bottom: 26px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--brand-600);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 22px; height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--brand-600), var(--brand-300));
    }
    h1 {
      margin: 12px 0 10px;
      font-size: clamp(30px, 4.2vw, 46px);
      font-weight: 700;
      letter-spacing: -.033em;
      line-height: 1.05;
    }
    .lede {
      margin: 0;
      max-width: 68ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.62;
    }

    /* ============================================================ Panels */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(390px, .85fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      background: var(--panel);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 20px 24px 17px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel-alt), var(--panel));
    }
    .panel-head h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.012em;
    }
    .panel-head p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .panel-body { padding: 22px 24px 24px; }

    /* Numbered step badge */
    .step {
      display: grid;
      place-items: center;
      width: 26px; height: 26px;
      flex: none;
      margin-top: 1px;
      border-radius: 8px;
      background: var(--brand-050);
      color: var(--brand-600);
      border: 1px solid var(--brand-100);
      font-size: 12px;
      font-weight: 800;
    }

    /* ============================================================ Forms */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 15px; }
    label.field {
      display: grid;
      gap: 6px;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .015em;
    }
    label.field.wide { grid-column: 1 / -1; }

    input[type="text"], select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 0 12px;
      color: var(--ink);
      background: var(--panel);
      font-weight: 500;
      transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }
    select {
      appearance: none;
      padding-right: 34px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    input[type="text"]:hover, select:hover { border-color: var(--brand-300); }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--brand-500) 16%, transparent);
    }
    select:disabled {
      background-color: var(--panel-alt);
      color: var(--subtle);
      cursor: not-allowed;
      border-style: dashed;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    /* ============================================================ Features */
    .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .feature {
      position: relative;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      min-height: 54px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--panel-alt);
      cursor: pointer;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }
    .feature:hover { border-color: var(--brand-300); background: var(--panel); }
    .feature:has(input:checked) {
      border-color: color-mix(in srgb, var(--brand-500) 45%, var(--line));
      background: var(--brand-050);
    }
    .feature input {
      width: 16px; height: 16px;
      margin: 1px 0 0;
      flex: none;
      accent-color: var(--brand-600);
      cursor: pointer;
    }
    .feature span { font-size: 12.5px; font-weight: 650; line-height: 1.3; }
    .feature small {
      display: block;
      margin-top: 3px;
      color: var(--subtle);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .feature.locked {
      background: var(--brand-050);
      border-color: var(--brand-100);
      border-style: dashed;
      cursor: not-allowed;
    }
    .feature.locked input { cursor: not-allowed; }
    .feature.locked::after {
      content: var(--locked-label, "LOCKED");
      position: absolute;
      top: 9px; right: 10px;
      color: var(--brand-600);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .08em;
      opacity: .78;
    }

    /* ============================================================ Icons
       Inline SVG data URIs, applied through CSS so the JavaScript that
       rewrites notices and the status banner stays untouched. */
    .notice::before, .status::before {
      content: "";
      flex: none;
      width: 17px;
      height: 17px;
      margin-top: 1px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }
    /* lock-closed */
    .notice.official::before {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315734f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>");
    }
    /* beaker: exploratory, non-official */
    .notice.custom::before {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a5a00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 3h6'/><path d='M10 3v6L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9V3'/><path d='M7 15h10'/></svg>");
    }
    /* shield-check */
    .status.ready::before {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315734f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>");
    }
    /* alert-triangle */
    .status.warn::before {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a5a00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'/><path d='M12 9v4'/><path d='M12 17h.01'/></svg>");
    }
    @media (prefers-color-scheme: dark) {
      .notice.official::before {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236ecfa2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>");
      }
      .notice.custom::before {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0b256' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 3h6'/><path d='M10 3v6L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9V3'/><path d='M7 15h10'/></svg>");
      }
      .status.ready::before {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236ecfa2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>");
      }
      .status.warn::before {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0b256' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'/><path d='M12 9v4'/><path d='M12 17h.01'/></svg>");
      }
    }
    .btn-icon { width: 15px; height: 15px; flex: none; }

    /* ============================================================ Notices */
    .notice {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: var(--r-md);
      border-left: 3px solid currentColor;
      font-size: 12.2px;
      line-height: 1.55;
    }
    .notice.official { color: var(--ok); background: var(--ok-bg); }
    .notice.custom { color: var(--warn); background: var(--warn-bg); }

    /* ============================================================ Preview */
    .preview { position: sticky; top: 18px; }
    .status {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin-bottom: 14px;
      padding: 13px 14px;
      border-radius: var(--r-md);
      border-left: 3px solid currentColor;
    }
    .status.ready { color: var(--ok); background: var(--ok-bg); }
    .status.warn { color: var(--warn); background: var(--warn-bg); }
    .status strong { display: block; margin-bottom: 3px; font-size: 12.5px; font-weight: 750; }
    .status span { display: block; color: var(--ink-soft); font-size: 11.5px; line-height: 1.5; }

    .code-wrap {
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid #1b332a;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
    }
    .code-wrap::before {
      content: "sia_model_scenario.json";
      display: block;
      padding: 8px 14px;
      background: #0c1c16;
      color: #7fb8a1;
      border-bottom: 1px solid #1b332a;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .04em;
    }
    pre {
      max-height: 480px;
      margin: 0;
      padding: 15px;
      overflow: auto;
      color: #d5efe3;
      background: #0e211a;
      font: 11px/1.62 var(--mono);
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 2;
    }
    pre::-webkit-scrollbar { width: 10px; height: 10px; }
    pre::-webkit-scrollbar-track { background: #0b1a14; }
    pre::-webkit-scrollbar-thumb { background: #26463a; border-radius: 6px; border: 2px solid #0b1a14; }
    pre::-webkit-scrollbar-thumb:hover { background: #33604e; }

    /* ============================================================ Actions */
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-top: 14px; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .005em;
      cursor: pointer;
      transition: background .14s ease, border-color .14s ease, transform .12s ease, box-shadow .14s ease;
    }
    button.primary {
      color: #fff;
      background: linear-gradient(180deg, var(--brand-600), var(--brand-700));
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, .16);
    }
    button.primary:hover { background: linear-gradient(180deg, var(--brand-500), var(--brand-600)); }
    button.secondary {
      color: var(--brand-600);
      background: var(--panel);
      border-color: var(--line-strong);
    }
    button.secondary:hover { border-color: var(--brand-400); background: var(--brand-050); }
    button:active { transform: translateY(1px); }

    .toast {
      min-height: 18px;
      margin-top: 9px;
      color: var(--ok);
      font-size: 11.5px;
      font-weight: 700;
    }

    .usage {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .usage code {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-alt);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
    }

    /* ============================================================ Responsive */
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .preview { position: static; }
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 22px); padding: 20px 0 44px; }
      .grid, .features { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      .panel-head, .panel-body { padding-left: 17px; padding-right: 17px; }
      .topbar { flex-wrap: wrap; }
    }
    @media print {
      body { background: #fff; }
      .panel { box-shadow: none; }
      .actions, .topbar { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand-mark" aria-hidden="true">IES</div>
      <div class="brand-text">
        <b>Virtual Environment</b>
        <span data-i18n="brand_subtitle">Swiss compliance toolkit</span>
      </div>
      <div class="topbar-spacer"></div>
      <label class="lang">
        <span data-i18n="language_label">Language</span>
        <select id="lang" aria-label="Language"></select>
      </label>
      <div class="chip">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        SIA 380/2 &nbsp;·&nbsp; SIA 4010
      </div>
    </div>

    <header class="hero">
      <div class="eyebrow" data-i18n="eyebrow_generator">Controlled generator</div>
      <h1 data-i18n="header_title">Swiss VE Model Builder</h1>
      <p class="lede" data-i18n="lede"></p>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <div class="step" aria-hidden="true">1</div>
          <div>
            <h2 data-i18n="panel_scenario_title"></h2>
            <p data-i18n="panel_scenario_sub"></p>
          </div>
        </div>
        <div class="panel-body">
          <div class="grid">
            <label class="field wide"><span data-i18n="label_scenario_id"></span>
              <input id="scenarioId" type="text" value="SIA4010_1A_TEST2A" autocomplete="off" spellcheck="false">
            </label>
            <label class="field"><span data-i18n="label_profile"></span>
              <select id="profile">
                <option value="SIA4010_OFFICIAL" data-i18n="option_official"></option>
                <option value="CUSTOM_REFERENCE" data-i18n="option_custom"></option>
              </select>
            </label>
            <label class="field"><span data-i18n="label_target_class"></span>
              <select id="targetClass"></select>
            </label>
            <label class="field"><span data-i18n="label_variant"></span>
              <select id="variant"></select>
            </label>
            <label class="field"><span data-i18n="label_case"></span>
              <select id="caseId"></select>
            </label>
            <label class="field wide"><span data-i18n="label_execution_mode"></span>
              <select id="executionMode">
                <option value="PREPARE_ONLY" data-i18n="option_prepare_only"></option>
                <option value="CREATE_IN_ACTIVE_VE_PROJECT" data-i18n="option_create"></option>
              </select>
            </label>
          </div>

          <h3 class="section-title"><span data-i18n="section_model_features"></span></h3>
          <div id="features" class="features"></div>
          <div id="profileNotice" class="notice official"></div>

          <h3 class="section-title"><span data-i18n="section_input_files"></span></h3>
          <div class="grid">
            <label class="field wide"><span data-i18n="label_official_case_manifest"></span>
              <input id="caseManifest" type="text" value="config/sia4010_all_classes.json" spellcheck="false">
            </label>
            <label class="field"><span data-i18n="label_ve_config"></span>
              <input id="veConfig" type="text" value="reference_model_config.json" spellcheck="false">
            </label>
            <label class="field"><span data-i18n="label_ve_assets"></span>
              <input id="veAssets" type="text" value="reference_model_assets.json" spellcheck="false">
            </label>
          </div>
        </div>
      </section>

      <aside class="panel preview">
        <div class="panel-head">
          <div class="step" aria-hidden="true">2</div>
          <div>
            <h2 data-i18n="panel_manifest_title"></h2>
            <p data-i18n="panel_manifest_sub"></p>
          </div>
        </div>
        <div class="panel-body">
          <div id="status" class="status ready"></div>
          <div class="code-wrap">
            <pre id="jsonPreview" aria-label="Aperçu JSON"></pre>
          </div>
          <div class="actions">
            <button id="download" class="primary" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
              </svg>
              <span data-i18n="btn_download_json"></span>
            </button>
            <button id="copy" class="secondary" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="12" height="12" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span data-i18n="btn_copy"></span>
            </button>
          </div>
          <div id="toast" class="toast" aria-live="polite"></div>
          <div class="usage" id="usage"></div>
        </div>
      </aside>
    </div>
  </main>

  <script id="catalog" type="application/json">__CATALOG_JSON__</script>
  <script id="i18n" type="application/json">__I18N_JSON__</script>
  <script>
    const catalog = JSON.parse(document.getElementById("catalog").textContent);
    const i18n = JSON.parse(document.getElementById("i18n").textContent);
    const $ = id => document.getElementById(id);
    const featureInputs = new Map();

    // Active language: remembered choice, else the browser preference, else default.
    function pickLanguage() {
      const stored = (() => { try { return localStorage.getItem("sia-ui-language"); } catch (_) { return null; } })();
      const candidates = [stored, ...(navigator.languages || [navigator.language || ""])];
      for (const raw of candidates) {
        if (!raw) continue;
        const code = String(raw).toLowerCase().replace("_", "-");
        if (i18n.languages.includes(code)) return code;
        const prefix = code.split("-")[0];
        if (i18n.languages.includes(prefix)) return prefix;
      }
      return i18n.default;
    }

    let language = pickLanguage();
    const tr = key => (i18n.strings[language] || {})[key]
      || (i18n.strings[i18n.default] || {})[key] || key;

    function applyLanguage(code) {
      language = i18n.languages.includes(code) ? code : i18n.default;
      try { localStorage.setItem("sia-ui-language", language); } catch (_) {}
      document.documentElement.lang = language;
      document.title = tr("header_title") + " — IESVE";
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = tr(node.getAttribute("data-i18n"));
      });
      // The locked badge is a CSS pseudo-element, so it reads a custom property.
      document.documentElement.style.setProperty(
        "--locked-label", JSON.stringify(tr("locked_badge")));
      $("usage").innerHTML = tr("usage_hint")
        .replace("{file}", "<code>sia_model_scenario.json</code>")
        .replace("{script}", "<code>Run_VE_SIA_Model_Builder.py</code>");
      $("toast").textContent = "";
      syncFeatures();
    }

    function options(select, values) {
      const previous = select.value;
      select.innerHTML = "";
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      if (values.includes(previous)) select.value = previous;
    }

    function syncClass() {
      options($("variant"), catalog.classes[$("targetClass").value]);
      syncVariant();
    }

    function syncVariant() {
      options($("caseId"), catalog.cases[$("variant").value]);
      syncFeatures();
    }

    function requiredFeatures() {
      return catalog.official_feature_matrix[$("variant").value][$("caseId").value];
    }

    function syncFeatures() {
      const official = $("profile").value === "SIA4010_OFFICIAL";
      const required = requiredFeatures();
      featureInputs.forEach((input, featureId) => {
        if (official) input.checked = required[featureId];
        input.disabled = official;
        input.closest(".feature").classList.toggle("locked", official);
      });
      const notice = $("profileNotice");
      if (official) {
        $("executionMode").disabled = false;
        notice.className = "notice official";
        notice.textContent = tr("notice_official");
      } else {
        $("executionMode").value = "PREPARE_ONLY";
        $("executionMode").disabled = true;
        notice.className = "notice custom";
        notice.textContent = tr("notice_custom");
      }
      autoScenarioId();
      update();
    }

    function autoScenarioId() {
      if (document.activeElement === $("scenarioId")) return;
      const prefix = $("profile").value === "SIA4010_OFFICIAL" ? "SIA4010" : "CUSTOM";
      $("scenarioId").value = `${prefix}_${$("targetClass").value}_${$("caseId").value}`;
    }

    function payload() {
      const features = {};
      featureInputs.forEach((input, id) => features[id] = input.checked);
      return {
        schema_version: "1.0",
        scenario_id: $("scenarioId").value.trim(),
        profile: $("profile").value,
        selection: {
          target_class: $("targetClass").value,
          variant: $("variant").value,
          case_id: $("caseId").value
        },
        features,
        files: {
          case_manifest_file: $("caseManifest").value.trim(),
          ve_config_file: $("veConfig").value.trim(),
          ve_asset_manifest_file: $("veAssets").value.trim()
        },
        execution: { mode: $("executionMode").value }
      };
    }

    function update() {
      const data = payload();
      $("jsonPreview").textContent = JSON.stringify(data, null, 2);
      const creating = data.execution.mode === "CREATE_IN_ACTIVE_VE_PROJECT";
      const status = $("status");
      status.className = `status ${creating ? "warn" : "ready"}`;
      const title = creating
        ? tr("status_prevalidation_required_title") : tr("status_no_mutation_title");
      const detail = creating
        ? tr("status_prevalidation_required_detail") : tr("status_no_mutation_detail");
      status.innerHTML = "";
      const wrap = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = title;
      const span = document.createElement("span");
      span.textContent = detail;
      wrap.append(strong, span);
      status.appendChild(wrap);
    }

    catalog.features.forEach(feature => {
      const label = document.createElement("label");
      label.className = "feature";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.addEventListener("change", update);
      const text = document.createElement("span");
      text.textContent = feature.label;
      const group = document.createElement("small");
      group.textContent = feature.group;
      text.appendChild(group);
      label.append(input, text);
      $("features").appendChild(label);
      featureInputs.set(feature.id, input);
    });

    options($("targetClass"), Object.keys(catalog.classes));
    $("targetClass").value = "1A";
    ["targetClass", "profile"].forEach(id => $(id).addEventListener("change", () => id === "targetClass" ? syncClass() : syncFeatures()));
    $("variant").addEventListener("change", syncVariant);
    $("caseId").addEventListener("change", syncFeatures);
    ["scenarioId", "executionMode", "caseManifest", "veConfig", "veAssets"].forEach(id => $(id).addEventListener("input", update));

    $("download").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(payload(), null, 2) + "\n"], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "sia_model_scenario.json";
      anchor.click();
      URL.revokeObjectURL(url);
      $("toast").textContent = tr("toast_downloaded");
    });
    $("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2));
        $("toast").textContent = tr("toast_copied");
      } catch (_) {
        $("toast").textContent = tr("toast_copy_failed");
      }
    });

    options($("lang"), i18n.languages);
    [...$("lang").options].forEach(opt => { opt.textContent = i18n.labels[opt.value] || opt.value; });
    $("lang").value = language;
    $("lang").addEventListener("change", () => applyLanguage($("lang").value));

    syncClass();
    applyLanguage(language);
  </script>
</body>
</html>
